# =====================================================================
# alveo_u55c.cfg
# v++ system configuration for quantum_fpga_kernel_complex128 (unified)
# Platform: xilinx_u55c_gen3x4_xdma_base_3_202210_1
#
# HBM2 on U55C: 16 GB across 32 pseudo-channels (PCs), 256 MB / PC.
# Kernel has 8 bank arguments (bank0..bank7); each is assigned 3 PCs
# (768 MB/bank, 6 GB total) which supports statevectors up to ~28
# qubits (2^28 * 16B = 4 GB / 8 banks = 512 MB/bank, comfortably under
# the 768 MB ceiling) while leaving 8 PCs (2 GB) free for the
# instruction buffer and future double-buffering / multi-FPGA
# halo-exchange staging area.
# =====================================================================

[connectivity]
# ---- statevector banks: 3 PCs each, contiguous, non-overlapping ----
sp=quantum_fpga_kernel_complex128_1.bank0:HBM[0:2]
sp=quantum_fpga_kernel_complex128_1.bank1:HBM[3:5]
sp=quantum_fpga_kernel_complex128_1.bank2:HBM[6:8]
sp=quantum_fpga_kernel_complex128_1.bank3:HBM[9:11]
sp=quantum_fpga_kernel_complex128_1.bank4:HBM[12:14]
sp=quantum_fpga_kernel_complex128_1.bank5:HBM[15:17]
sp=quantum_fpga_kernel_complex128_1.bank6:HBM[18:20]
sp=quantum_fpga_kernel_complex128_1.bank7:HBM[21:23]

# ---- gate sequence buffer (small; loaded to BRAM at kernel start) ----
sp=quantum_fpga_kernel_complex128_1.gate_sequence:HBM[24]

# HBM[25:31] intentionally unassigned -- headroom for scaling bank
# capacity to 29+ qubits, or for a second kernel instance / staging
# buffers if this is later folded into the multi-FPGA design.

# Pin the kernel to a single SLR near the HBM controller (SLR0 on
# U55C) rather than letting Vivado spread the 8 wide AXI masters
# across SLR boundaries -- this is the same fix that resolved the
# level-7 routing congestion seen when the RTL rewrite (Qniverse v06)
# was still using 16 HBM banks; going wide (8 masters, 3 PCs each)
# instead of using many separate 1-PC masters keeps the SLR crossing
# count down.
slr=quantum_fpga_kernel_complex128_1:SLR0

[clock]
# Target frequency for the kernel. Kept conservative relative to the
# 258.5 MHz achieved on the native-RTL Qniverse v06 rewrite, since
# this design still carries HLS-inferred AXI arbitration/mux logic
# around the 8-bank switch that the hand-written RTL does not.
freqHz=225000000:quantum_fpga_kernel_complex128_1

[vivado]
# Timing closure directives -- 8 wide (512-bit) AXI masters plus a
# branch-free but still address-dependent bank-select mux is a
# congestion-prone design; push placement/routing harder than default.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

[advanced]
# Allow the compiler more freedom to retime across the HBM AXI
# interfaces, useful for closing timing on the 8-master bank router.
param=compiler.addOutputTypes=hw_export
misc=solution_name=unified_hbm8_ii1

# =====================================================================
# Build with (from the directory containing the .cpp and this file):
#
#   v++ -c -t hw --platform xilinx_u55c_gen3x4_xdma_base_3_202210_1 \
#       -k quantum_fpga_kernel_complex128 \
#       --config alveo_u55c.cfg \
#       -o quantum_fpga_kernel_complex128.xo \
#       quantum_fpga_kernel_unified.cpp
#
#   v++ -l -t hw --platform xilinx_u55c_gen3x4_xdma_base_3_202210_1 \
#       --config alveo_u55c.cfg \
#       -o quantum_fpga_kernel_complex128.xclbin \
#       quantum_fpga_kernel_complex128.xo
#
# If PLACE/ROUTE still fails to close timing at 225 MHz, the fastest
# lever is dropping to 200 MHz before touching the bank count --
# 8 banks is already at the point where the prior RTL rewrite ran
# into SLR-crossing congestion at higher bank counts, so going wider
# on banks (rather than adjusting frequency/PC span) is not
# recommended as the first fix.
# =====================================================================
